<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOSHIPRO — Create Account Node</title>
    <!-- Core Engine Typography & Icons Matched to Admin Command Console -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <!-- Standalone Externalized Component Styles -->
    <link rel="stylesheet" href="../css/style.css">  
</head>

<body>

    <div class="auth-container-wrapper">
        <!-- Structural Corporate Branding Display -->
        <header class="auth-brand-header">
            <div class="logo-wrapper">
                <i class="fa-solid fa-shield-halved"></i> JOBS<span>HUB</span>
            </div>
            <p>Access Portal Override — Provision an Authorized Client Platform Node</p>
        </header>

        <!-- Form Module Section Using Admin Console Structural Layout Classes -->
        <section class="admin-form-section">
            <div class="form-container">
                <div class="form-header">
                    <h2><i class="fa-solid fa-user-plus" style="color: #a855f7;"></i> Direct System User Registration
                    </h2>
                    <p>Initialize production baseline attributes straight into ecosystem tables to build active tracking
                        portfolios.</p>
                </div>

                <form id="registerForm" novalidate>
                    <!-- Identity Text Form Module Component Block -->
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" placeholder="Enter full name" autocomplete="name" required>
                    </div>

                    <!-- Communication Network Delivery Module Component Block -->
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="name@domain.com" autocomplete="email" required>
                    </div>

                    <!-- Multi-column Stack Component Framework for Mobile Forms -->
                    <div class="form-split-row">
                        <!-- Contact Link Module Component Block -->
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" placeholder="Enter phone number" autocomplete="tel" required>
                        </div>

                        <!-- Regional Segment Module Component Block -->
                        <div class="form-group">
                            <label for="location">Location</label>
                            <select id="location" required>
                                <option value="" disabled selected hidden>Select County...</option>
                                <option value="Bungoma">Bungoma</option>
                                <option value="Busia">Busia</option>
                                <option value="Kakamega">Kakamega</option>
                                <option value="Vihiga">Vihiga</option>
                                <option value="Mombasa">Mombasa</option>
                                <option value="Nairobi">Nairobi</option>
                                <option value="Kiambu">Kiambu</option>
                                <option value="Eldoret">Eldoret</option>
                                <option value="Kisumu">Kisumu</option>
                                <option value="Nakuru">Nakuru</option>
                                <option value="Kisii">Kisii</option>
                            </select>
                        </div>
                    </div>

                    <!-- Dual Password Validation Entry Group Block -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-field-container">
                            <input type="password" id="password" placeholder="Enter password"
                                autocomplete="new-password" required>
                            <i class="fa-solid fa-eye toggle-visibility-trigger" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-field-container">
                            <input type="password" id="confirmPassword" placeholder="Re-enter password"
                                autocomplete="new-password" required>
                            <i class="fa-solid fa-eye toggle-visibility-trigger" id="toggleConfirmPassword"></i>
                        </div>
                    </div>

                    <!-- Legal Terms Compliance Integration Selection Link -->
                    <label class="compliance-row" for="terms">
                        <input type="checkbox" id="terms" required>
                        <span>I confirm deployment attributes are accurate and consent to initialize authentication data
                            parameters in compliance with the <a href="#">JOSHIPRO Node Security Guidelines</a>.</span>
                    </label>

                    <!-- Submission Integration Trigger Execution Injection Controller -->
                    <div class="form-group button-group" style="margin-bottom: 0;">
                        <button type="submit" class="btn-submit-inject">
                            <i class="fa-solid fa-bolt"></i> Register Platform Account
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Redirection Navigation Row Component Area -->
        <footer class="auth-routing-footer">
            Already possess an activated platform credential? <a href="login.html">Sign In Here</a>
        </footer>
    </div>

    <!-- Core App Logic Controller Interfacing Module -->
    <script type="module" src="../js/register.js"></script>
</body>

</html>
