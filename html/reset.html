<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOSHIPRO - Reset Credentials</title>
    <!-- FontAwesome Vector Icons Link Hooks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Using your shared authorization stylesheet -->
    <link rel="stylesheet" href="../css/reset.css">
</head>

<body>

    <div class="background-decor animate-blob1"></div>
    <div class="background-decor animate-blob2"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">JOSHI<span class="gradient-text">PRO</span></div>
                <h2>Reset Password</h2>
                <p>Enter your inbound email address to extract a secure recovery token link.</p>
            </div>

            <!-- Dynamic Interactive Status Alert Banners -->
            <div id="alertBox" class="auth-alert hidden"></div>

            <form id="resetForm" novalidate>
                <div class="form-group">
                    <label for="resetEmail">Registered Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="resetEmail" placeholder="name@example.com" required
                            autocomplete="email">
                    </div>
                </div>

                <button type="submit" id="resetSubmitBtn" class="auth-btn">
                    <span>Send Reset Link</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Remembered your credentials? <a href="login.html" class="auth-link">Back to Login</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase / Password Reset Workflow Lifecycle Management Script Context Link -->
    <script type="module" src="../js/reset.js"></script>
</body>

</html>
