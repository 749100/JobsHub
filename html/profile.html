<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOSHIPRO - Manage Profile</title>
    <!-- ✅ FIXED: Replaced broken link with official FontAwesome stylesheet to display icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Links to separate subfolder layout -->
    <link rel="stylesheet" href="../css/profile.css">
</head>

<body>

    <div class="profile-container">
        <header class="profile-header">
            <h2>Manage Your Profile 👤</h2>
            <p>Update your personal information and upload an avatar picture for your dashboard view.</p>
        </header>

        <form id="profileForm">
            <!-- Interactive Avatar Photo Uploader Circle Slot -->
            <div class="avatar-upload-section">
                <div class="avatar-preview-box" id="avatarPreview">
                    <i class="fa-solid fa-user" id="defaultAvatarIcon"></i>
                </div>
                <label for="imageUpload" class="file-label">
                    <i class="fa-solid fa-camera"></i> Upload New Photo
                </label>
                <input type="file" id="imageUpload" accept="image/*">
                <p class="file-hint">Max file size: 500KB (JPG/PNG)</p>
            </div>

            <div class="form-group">
                <label for="userName">Full Name</label>
                <input type="text" id="userName" required placeholder="e.g. John Joshi">
            </div>

            <!-- ✅ MODIFIED: Profession field converted to a clean Dropdown List -->
            <div class="form-group">
                <label for="userProfession">Profession / Job Title</label>
                <select id="userProfession" required>
                    <option value="" disabled selected>Select your profession...</option>
                    <option value="Full Stack Developer">Full Stack Developer</option>
                    <option value="Frontend Engineer">Frontend Engineer</option>
                    <option value="Backend Developer">Backend Developer</option>
                    <option value="Data Scientist">Data Scientist</option>
                    <option value="UI/UX Designer">UI/UX Designer</option>
                    <option value="Mobile App Developer">Mobile App Developer</option>
                    <option value="DevOps Engineer">DevOps Engineer</option>
                    <option value="Project Manager">Project Manager</option>
                    <option value="Digital Marketer">Digital Marketer</option>
                    <option value="Human Resources Specialist">Human Resources Specialist</option>
                </select>
            </div>

            <!-- Added Phone Number Field -->
            <div class="form-group">
                <label for="userPhone">Phone Number</label>
                <input type="tel" id="userPhone" required placeholder="e.g. +1 (555) 000-0000">
            </div>

            <!-- ✅ MODIFIED: Location field converted to Western Kenya Counties Dropdown List -->
            <div class="form-group">
                <label for="userLocation">Location (Western Region)</label>
                <select id="userLocation" required>
                    <option value="" disabled selected>Select your county...</option>
                    <option value="Bungoma">Bungoma</option>
                    <option value="Busia">Busia</option>
                    <option value="Kakamega">Kakamega</option>
                    <option value="Vihiga">Vihiga</option>
                </select>
            </div>

            <div class="form-group">
                <label for="userBio">Professional Bio</label>
                <textarea id="userBio" rows="4"
                    placeholder="Tell potential clients about your skill sets and work experience..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="saveProfileBtn">Save Profile Modifications</button>
        </form>

        <p id="statusMsg" class="status-msg"></p>

        <!-- Quick navigation button pointing back to the main workspace view -->
        <a href="dashboard.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Dashboard</a>
    </div>

    <!-- Isolated Modular JavaScript Code Layer -->
    <script type="module" src="../js/profile.js"></script>
</body>

</html>
