<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOSHIPRO - Dashboard</title>
    <!-- Verified FontAwesome CDN Core Injection Hook -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="background-decor animate-blob1"></div>
    <div class="background-decor animate-blob2"></div>

    <div class="dashboard-wrapper">

        <header class="navbar">
            <div class="nav-left">
                <!-- The Mechanical Menu Toggle Interface Button -->
                <button id="menuBtn" class="menu-btn">☰ Menu</button>
                <div class="logo">JOSHI<span class="gradient-text">PRO</span></div>

                <!-- The Dashboard Sidebar Layout Component Layer -->
                <aside id="sidebar" class="sidebar">
                    <div class="sidebar-brand">Dashboard</div>
                    <nav class="sidebar-menu">
                        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a>
                        <a href="findJobs.html"><i class="fa-solid fa-magnifying-glass"></i> Find Jobs</a>
                        <a href="postJobs.html"><i class="fa-solid fa-pen-to-square"></i> Post Jobs</a>
                        <a href="applications.html"><i class="fa-solid fa-file-lines"></i> My Applications</a>
                    </nav>
                </aside>
            </div>

            <div class="nav-right">
                <button class="profile-trigger" id="profileBtn" aria-label="Toggle profile menu">
                    <div class="avatar" id="userAvatar">
                        <img src="../assets/logo.png" alt="User Avatar" id="avatarImg">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </button>

                <ul class="dropdown-menu" id="dropdownMenu">
                    <li><a href="profile.html"><i class="fa-regular fa-id-card"></i> Profile</a></li>
                    <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
                    <li class="db-divider"></li>
                    <li><button id="logoutBtn" class="logout-item"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                            Log Out</button></li>
                </ul>
            </div>
        </header>

        <main class="main-content">
            <!-- Glassmorphic Primary Session Identity Card -->
            <div class="welcome-card">
                <h1>Welcome back! 👋</h1>
                <p id="userInfo">Loading your application details...</p>
            </div>

            <!-- Enhanced High-Performance Responsive Metrics Grid Layout -->
            <div class="stats-cards">
                <div class="stat-card neon-blue">
                    <div class="stat-icon"><i class="fa-solid fa-briefcase"></i></div>
                    <div class="stat-info-wrapper">
                        <h2 id="totalJobs">Syncing...</h2>
                        <p>Total Jobs</p>
                    </div>
                </div>
                <div class="stat-card neon-purple">
                    <div class="stat-icon"><i class="fa-solid fa-paper-plane"></i></div>
                    <div class="stat-info-wrapper">
                        <h2 id="activeApplications">Syncing...</h2>
                        <p>Applications Sent</p>
                    </div>
                </div>
                <div class="stat-card neon-orange">
                    <div class="stat-icon"><i class="fa-solid fa-hourglass-half"></i></div>
                    <div class="stat-info-wrapper">
                        <h2 id="savedJobs">Syncing...</h2>
                        <p>Pending Review</p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="dashboard-footer">
            <div class="footer-links">
                <a href="help.html" class="footer-btn"><i class="fa-solid fa-headset"></i> Help Center</a>
                <a href="contact.html" class="footer-btn"><i class="fa-solid fa-envelope"></i> Contact Us</a>
            </div>
            <div class="footer-copyright">
                &copy; 2026 JOSHIPRO. All rights reserved.
            </div>
        </footer>
    </div>

    <!-- Firebase / Authentication Lifecycle Client Script Connection -->
    <script type="module" src="../js/dashboard.js"></script>
</body>

</html>
